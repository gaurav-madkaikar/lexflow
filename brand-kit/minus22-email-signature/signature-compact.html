<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minus22 compact email signature</title></head>
<body style="margin:0;padding:24px;background:#ffffff;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;border-collapse:collapse;font-family:'Avenir Next','Helvetica Neue',Inter,Arial,sans-serif;color:#11110f;">
    <tr>
      <td style="width:64px;padding-right:16px;vertical-align:middle;">
        <img src="logos/minus22-logo-email.png" width="56" height="56" alt="Minus22" style="display:block;width:56px;height:56px;border:0;border-radius:16px;">
      </td>
      <td style="padding-left:16px;border-left:3px solid #ff6542;vertical-align:middle;">
        <div style="font-size:17px;line-height:22px;font-weight:700;letter-spacing:-0.25px;">[Full name] <span style="font-weight:400;color:#a3a39d;">·</span> <span style="font-size:13px;font-weight:600;color:#65655f;">[Job title]</span></div>
        <div style="padding-top:4px;font-size:12px;line-height:18px;color:#65655f;"><a href="mailto:name@minus22.com" style="color:#343430;text-decoration:none;">name@minus22.com</a>&nbsp;&nbsp;·&nbsp;&nbsp;<a href="https://minus22.com" style="color:#343430;text-decoration:none;">minus22.com</a>&nbsp;&nbsp;·&nbsp;&nbsp;+91 00000 00000</div>
      </td>
    </tr>
  </table>
</body>
</html>
