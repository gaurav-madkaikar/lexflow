<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Minus22 email signature</title>
</head>
<body style="margin:0;padding:24px;background:#ffffff;">
  <!-- Replace bracketed details and the logo URL before company-wide deployment. -->
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:590px;border-collapse:collapse;font-family:'Avenir Next','Helvetica Neue',Inter,Arial,sans-serif;color:#11110f;">
    <tr>
      <td style="width:116px;padding:2px 22px 2px 0;vertical-align:top;border-right:1px solid #deded9;">
        <img src="logos/minus22-logo-email.png" width="96" height="96" alt="Minus22" style="display:block;width:96px;height:96px;border:0;border-radius:26px;">
      </td>
      <td style="padding:0 0 0 22px;vertical-align:top;">
        <div style="font-size:21px;line-height:26px;font-weight:700;letter-spacing:-0.35px;color:#11110f;">[Full name]</div>
        <div style="padding-top:2px;font-size:14px;line-height:20px;font-weight:600;color:#c94b31;">[Job title]</div>
        <div style="padding-top:8px;font-size:13px;line-height:19px;color:#65655f;">
          <a href="mailto:name@minus22.com" style="color:#343430;text-decoration:none;">name@minus22.com</a>
          <span style="color:#bbb9b2;">&nbsp;·&nbsp;</span>
          <a href="tel:+910000000000" style="color:#343430;text-decoration:none;">+91 00000 00000</a>
        </div>
        <div style="font-size:13px;line-height:19px;color:#65655f;">
          <a href="https://minus22.com" style="color:#343430;text-decoration:none;">minus22.com</a>
          <span style="color:#bbb9b2;">&nbsp;·&nbsp;</span>
          <span>[City, Country]</span>
        </div>
        <div style="padding-top:11px;font-size:11px;line-height:16px;font-weight:700;letter-spacing:1.25px;text-transform:uppercase;color:#85857e;">Ideas below zero. Impact above expectations.</div>
      </td>
    </tr>
    <tr>
      <td colspan="2" style="padding-top:16px;">
        <div style="height:3px;line-height:3px;background:#ff6542;border-radius:3px;font-size:0;">&nbsp;</div>
        <div style="padding-top:8px;font-size:10px;line-height:15px;color:#8a8a84;">This message may contain confidential information intended only for the named recipient. If received in error, please notify the sender and delete it.</div>
      </td>
    </tr>
  </table>
</body>
</html>
